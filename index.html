<script>
(()=>{'use strict';

const GUNS={

frost:['FROST CORE',3400,3300,2500,'#112b39','#27536a','#9deaff','iceking'],
jungle:['TOXIC JUNGLE',5500,3400,2700,'#0f2b24','#285442','#b4ff80','hydra'],
lava:['LAVA FORTRESS',8200,3700,2900,'#2e151c','#5c2633','#ff7c4e','inferno'],

ocean:['ABYSS',18000,4400,3300,'#0c263a','#1c4a65','#5af2dc','leviathan'],

};
const ROLL_PRICE={pets:250,skins:350};
function rollPool(type){let catalog=type==='pets'?PETS:SKINS;return Object.entries(catalog).filter(([id])=>id!=='none'&&id!=='standard').map(([id,a])=>({id,name:a[0],weight:type==='pets'?a[2]:a[3]}))}
function rollRandom(type){let pool=rollPool(type),total=pool.reduce((a,b)=>a+b.weight,0),r=Math.random()*total;for(let item of pool){r-=item.weight;if(r<0)return item.id}return pool[pool.length-1].id}
function chanceText(type,id){let pool=rollPool(type),total=pool.reduce((a,b)=>a+b.weight,0),entry=pool.find(x=>x.id===id);return entry?(entry.weight/total*100).toFixed(1)+'%':''}
const SKILLS={nuke:['☢️ NUKE','Periodic area explosion'],turret:['🛡️ TURRET','Stationary auto-firing turret'],back:['🔫 BACK SHOT','Fire behind you too'],birds:['🦅 HUNTER BIRDS','Auto-attack nearby enemies'],orb:['🔮 DAMAGE ORB','Hurts enemies in its radius'],cutter:['⚙️ CUTTER','Rotating blades'],freeze:['❄️ FREEZE','Slows nearby enemies'],heal:['💚 REGEN','Recover health slowly']};
const PETS={
none:['No Pet',0,100],dog:['Scout Dog',0,42],cat:['Lucky Cat',0,27],fox:['Swift Fox',0,16],
owl:['Arcane Owl',0,8],wolf:['Frost Wolf',0,4],dragon:['Baby Dragon',0,2],phoenix:['Fire Phoenix',0,.8],griffin:['Storm Griffin',0,.2]
};
const SKINS={
standard:['Default',0,1,100],rookie:['Rookie Ranger',0,1.02,40],spider:['Web Runner',0,1.05,26],
shadow:['Shadow Agent',0,1.08,16],gold:['Golden Hero',0,1.12,9],cyber:['Cyber Ninja',0,1.15,5],
galaxy:['Galaxy Knight',0,1.18,2.5],phantom:['Phantom King',0,1.22,1.2],celestial:['Celestial Legend',0,1.28,.3]
};
let save={coins:0,guns:{pistol:1},maps:{neon:1},pets:{none:1},skins:{standard:1},gunLevels:{},gun:'pistol',map:'neon',pet:'none',skin:'standard',best:0};
try{let old=JSON.parse(localStorage.getItem('rift_raiders_save')||localStorage.getItem('shadow_siege_save')||'null');if(old)save={...save,...old}}catch(e){}
function persist(){try{localStorage.setItem('rift_raiders_save',JSON.stringify(save))}catch(e){}}
let activeShop='guns';let mode='menu',p={x:1300,y:1000,hp:100,max:100,r:17},enemies=[],bullets=[],effects=[],drops=[],turrets=[],birds=[],time=0,wave=1,kills=0,level=1,xp=0,need=35,spawn=0,shot=0,aim=0,firing=false,keys={},joy={x:0,y:0},dashCD=0,inv=0,skillLevels={},skillTimers={},boss=null,last=0,toastUntil=0,camX=0,camY=0,borderTick=0,petTimer=0,freezeTimer=0,weaponBonus=0,muted=false,audio=null,musicTimer=null;
const net={active:false,host:false,sock:null,id:'',room:'',peers:{},clock:0,snapshot:0,name:'Raider',lastWorld:0};
function netSend(obj){if(net.active&&net.sock&&net.sock.readyState===1)try{net.sock.send(JSON.stringify(obj))}catch(e){}}
function netDisconnect(){let sock=net.sock;net.active=false;net.sock=null;net.peers={};net.host=false;net.id='';$('onlineStatus').textContent='';if(sock)try{sock.close()}catch(e){}}
function safeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function defaultServer(){return location.protocol==='file:'?'ws://localhost:8787':(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'}
function onlineLobby(){
 netDisconnect();mode='lobby';menu.style.display='flex';
 let def=defaultServer();
 card.innerHTML=`<h1>ONLINE TEAMS</h1><p>Create a private team or join a friend's lobby (2–4 players).</p>
 <p><label>Server address<br><input id="serverURL" value="${safeText(def)}" placeholder="ws://192.168.1.5:8787/ws" autocomplete="off"></label></p>
 <p><label>Your player name<br><input id="playerName" value="Raider" maxlength="18" autocomplete="nickname"></label></p>
 <div class="lobbyTabs"><button id="chooseCreate" class="sel">➕ CREATE LOBBY</button><button id="chooseJoin">🔑 JOIN LOBBY</button></div>
 <div id="createFields"><p><label>Choose lobby password (4–32 characters)<br><input id="createPassword" type="password" minlength="4" maxlength="32" placeholder="Your secret password" autocomplete="new-password"></label></p><p>You'll receive a lobby code to share with friends.</p></div>
 <div id="joinFields" style="display:none"><p><label>Lobby code<br><input id="roomCode" maxlength="8" placeholder="Example: Q7KM2P" autocapitalize="characters"></label></p><p><label>Lobby password<br><input id="joinPassword" type="password" maxlength="32" placeholder="Ask the host for the password" autocomplete="off"></label></p></div>
 <p id="connectionInfo" role="status">The game server must be running. Friends on the same Wi-Fi use the host computer's IP.</p>
 <button id="connectTeam">➕ CREATE LOBBY</button><button id="backLobby">BACK</button>`;
 let action='create';function setAction(a){action=a;$('chooseCreate').classList.toggle('sel',a==='create');$('chooseJoin').classList.toggle('sel',a==='join');$('createFields').style.display=a==='create'?'block':'none';$('joinFields').style.display=a==='join'?'block':'none';$('connectTeam').textContent=a==='create'?'➕ CREATE LOBBY':'🔑 JOIN LOBBY'}
 $('chooseCreate').onclick=()=>setAction('create');$('chooseJoin').onclick=()=>setAction('join');
 $('backLobby').onclick=()=>{netDisconnect();mode='menu';renderShop()};
 $('connectTeam').onclick=()=>{
 let url=$('serverURL').value.trim(),name=$('playerName').value.trim().slice(0,18)||'Raider',password=(action==='create' ? $('createPassword').value : $('joinPassword').value);
 let room=action==='join'?$('roomCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8):'';
 if(!/^wss?:\/\//i.test(url)){$('connectionInfo').textContent='Use ws:// or wss:// for the server address.';return}
 if(password.length<4||password.length>32){$('connectionInfo').textContent='Password must have 4–32 characters.';return}
 if(action==='join'&&room.length<4){$('connectionInfo').textContent='Enter the lobby code from the host.';return}
 $('connectionInfo').textContent='Connecting to game server…';$('connectTeam').disabled=true;
 let ws;try{ws=new WebSocket(url)}catch(e){$('connectionInfo').textContent='Invalid server address.';$('connectTeam').disabled=false;return}
 net.sock=ws;net.name=name;
 ws.onopen=()=>ws.send(JSON.stringify({t:action,room,password,map:save.map,name}));
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(err){return}netMessage(m)};
 ws.onerror=()=>{let info=$('connectionInfo');if(info)info.textContent='Cannot connect. Start the server and check its address.'};
 ws.onclose=()=>{let wasActive=net.active;net.active=false;net.sock=null;if(wasActive){mode='menu';menu.style.display='flex';card.innerHTML='<h1>DISCONNECTED</h1><p>The game server or host disconnected.</p><button id="backMain">MAIN MENU</button>';$('backMain').onclick=renderShop}else if(mode==='lobby'&&$('connectTeam')){$('connectTeam').disabled=false;$('connectionInfo').textContent='Connection closed. Check the address, lobby code and password.'}};
 }
}
function waitingRoom(){
 mode='waiting';menu.style.display='flex';let peers=Object.values(net.peers),count=peers.length+1;
 card.innerHTML=`<h1>TEAM LOBBY</h1><h2>🔑 CODE: <span style="color:#ffda86">${safeText(net.room)}</span></h2>
 <p>Share the <b>code and password</b> with friends. The host chooses the map. Up to 4 players.</p>
 <p>🗺️ ${safeText(MAPS[save.map]?.[0]||'NEON CITY')} · <b>${count}/4 players</b></p>
 <div class="waitingPlayers">${['👑 '+net.name,...peers.map(x=>'🤝 '+x.name)].map(x=>'<div>'+safeText(x)+'</div>').join('')}</div>
 ${net.host?'<button id="startTeam" '+(count<2?'disabled':'')+'>▶ START TEAM MATCH</button><p>'+(count<2?'Waiting for at least 1 teammate…':'Everyone ready? Start the match!')+'</p>':'<p>Waiting for the host to start the match…</p>'}
 <button id="leaveTeam">LEAVE LOBBY</button>`;
 if(net.host)$('startTeam').onclick=()=>netSend({t:'start'});
 $('leaveTeam').onclick=()=>{netDisconnect();mode='menu';renderShop()};
}
function netMessage(m){
 if(m.t==='error'){let info=$('connectionInfo');if(info)info.textContent=m.message||'Could not join lobby.';let b=$('connectTeam');if(b)b.disabled=false;return}
 if(m.t==='welcome'){
 net.active=true;net.host=!!m.host;net.id=m.id;net.room=m.room;net.peers={};for(let x of m.players||[])net.peers[x.id]={id:x.id,name:x.name,x:0,y:0,hp:100};
 if(MAPS[m.map])save.map=m.map;waitingRoom();return;
 }
 if(m.t==='start'&&net.active){begin();message('🤝 TEAM MATCH STARTED — '+net.room);return}
 if(m.t==='join'){net.peers[m.id]={id:m.id,name:m.name,x:0,y:0,hp:100};if(mode==='waiting')waitingRoom();else message('🤝 '+m.name+' joined!');return}
 if(m.t==='leave'){delete net.peers[m.id];if(mode==='waiting')waitingRoom();else message('A teammate left');return}
 if(m.t==='hostgone'){netDisconnect();mode='menu';menu.style.display='flex';card.innerHTML='<h1>HOST LEFT</h1><p>The team match ended because the host disconnected.</p><button id="backMain">MAIN MENU</button>';$('backMain').onclick=renderShop;return}
 if(m.t==='state'){net.peers[m.id]={...net.peers[m.id],...m};return}
 if(m.t==='world'&&net.active&&!net.host){time=Number(m.time)||time;wave=Number(m.wave)||wave;enemies=(m.enemies||[]).slice(0,100);bullets=(m.bullets||[]).slice(0,500);drops=(m.drops||[]).slice(0,100);turrets=(m.turrets||[]).slice(0,20);boss=enemies.find(e=>e.boss)||null;net.lastWorld=performance.now();return}
 if(m.t==='shot'&&net.active&&net.host){let other=net.peers[m.id];if(other&&GUNS[m.gun])fireAngle(m.angle,1,other,m.gun,m.upgrade);return}
 if(m.t==='reward'&&net.active){save.coins+=Math.max(0,m.coins|0);persist();return}
 if(m.t==='xp'&&net.active){gainXp(Math.max(0,m.xp|0));return}
 if(m.t==='hurt'&&net.active){hurt(Math.max(0,Number(m.damage)||0));return}
}
function netTick(dt){if(!net.active)return;net.clock+=dt;net.snapshot+=dt;if(net.clock>=.09){net.clock=0;netSend({t:'state',x:p.x,y:p.y,angle:aim,hp:p.hp,skin:save.skin,gun:save.gun,pet:save.pet,skills:skillLevels})}
 if(net.host&&net.snapshot>=.11){net.snapshot=0;netSend({t:'world',time,wave,enemies:enemies.map(e=>({x:e.x,y:e.y,r:e.r,type:e.type,hp:e.hp,max:e.max,hit:e.hit,phase:e.phase,boss:e.boss,id:e.id})),bullets:bullets.map(b=>({x:b.x,y:b.y,r:b.r,color:b.color,owner:b.owner})),drops:drops.map(o=>({x:o.x,y:o.y,r:o.r,v:o.v})),turrets:turrets.map(t=>({x:t.x,y:t.y}))})}}
function gainXp(amount){xp+=amount;if(xp>=need&&mode==='play'){xp-=need;level++;need=Math.ceil(need*1.40+16);upgradeScreen()}}
function updateGuest(dt){time+=dt;let m=MAPS[save.map],dx=joy.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=joy.y+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag}
 p.x=clamp(p.x+dx*p.speed*dt,p.r,m[2]-p.r);p.y=clamp(p.y+dy*p.speed*dt,p.r,m[3]-p.r);dashCD=Math.max(0,dashCD-dt);inv=Math.max(0,inv-dt);shot-=dt;borderTick-=dt;
 if((p.x<55||p.y<55||p.x>m[2]-55||p.y>m[3]-55)&&borderTick<=0){borderTick=.8;hurt(7)}
 if(firing&&shot<=0){fireAngle(aim);if(skillLevels.back)fireAngle(aim+Math.PI,skillLevels.back*.25+.3);shot=GUNS[save.gun][2]*1.33}
 if(skillLevels.heal){skillTimers.heal=(skillTimers.heal||0)-dt;if(skillTimers.heal<=0){skillTimers.heal=5-skillLevels.heal*.6;p.hp=Math.min(p.max,p.hp+2+skillLevels.heal*2)}}
 for(let b of birds)b.a+=dt*2;
 if(net.lastWorld&&performance.now()-net.lastWorld>5000)message('Waiting for host world updates…');
 refreshHUD();netTick(dt)
}
function teamTarget(e){let best=p,d=distance(e,p);if(net.active&&net.host)for(let r of Object.values(net.peers)){if(!r||!Number.isFinite(r.x)||r.hp<=0)continue;let n=distance(e,r);if(n<d){d=n;best=r}}return best}
function hitTarget(target,amount){if(target===p)hurt(amount);else if(net.active&&net.host)netSend({t:'hurt',to:target.id,damage:amount})}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function polygon(x,y,r,sides,angle=0){ctx.beginPath();for(let i=0;i<sides;i++){let a=angle+i*Math.PI*2/sides;if(!i)ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);else ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath()}
function mapDecor(x,y,seed,map){
 const q=seed%4,accent=MAPS[map][6];ctx.save();ctx.translate(x,y);ctx.rotate((seed%8)*Math.PI/4);
 if(map==='neon'||map==='cyber'){ctx.strokeStyle=accent;ctx.globalAlpha=.18;ctx.lineWidth=3;ctx.strokeRect(-18,-18,36,36);ctx.beginPath();ctx.moveTo(-32,0);ctx.lineTo(32,0);ctx.moveTo(0,-32);ctx.lineTo(0,32);ctx.stroke()}
 else if(map==='desert'){ctx.strokeStyle='#b89560';ctx.globalAlpha=.2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,0,18+i*12,.2,2.7);ctx.stroke()}}
 else if(map==='frost'){ctx.strokeStyle='#a3eaff';ctx.globalAlpha=.24;for(let i=0;i<6;i++){let a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*26,Math.sin(a)*26);ctx.stroke()}}
 else if(map==='jungle'){ctx.fillStyle='#63b276';ctx.globalAlpha=.21;for(let i=0;i<5;i++)polygon(Math.cos(i*1.25)*17,Math.sin(i*1.25)*17,18,3,i*1.25),ctx.fill()}
 else if(map==='lava'){ctx.strokeStyle='#ff8550';ctx.lineWidth=3;ctx.globalAlpha=.28;ctx.beginPath();ctx.moveTo(-28,-14);ctx.lineTo(-4,2);ctx.lineTo(14,-8);ctx.lineTo(28,17);ctx.stroke()}
 else if(map==='void'||map==='moon'){ctx.fillStyle=accent;ctx.globalAlpha=.27;for(let i=0;i<5;i++)ctx.fillRect(Math.sin(seed+i)*26,Math.cos(seed+i)*26,3,3)}
 else if(map==='ocean'){ctx.strokeStyle='#66e6d8';ctx.globalAlpha=.25;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,0,16+i*11,0,Math.PI);ctx.stroke()}}
 else if(map==='ruins'){ctx.strokeStyle='#d4c58e';ctx.globalAlpha=.26;ctx.lineWidth=5;ctx.strokeRect(-25,-22,50,44);ctx.beginPath();ctx.moveTo(-10,-22);ctx.lineTo(-10,22);ctx.stroke()}
 ctx.restore();ctx.globalAlpha=1;
}
function bossArt(e,color){ctx.fillStyle=color;polygon(0,0,e.r,10,e.phase*.13);ctx.fill();ctx.strokeStyle='#fff3d1';ctx.lineWidth=3;polygon(0,0,e.r*.78,8,-e.phase*.2);ctx.stroke();ctx.fillStyle='#121729';polygon(0,0,e.r*.57,6,-e.phase*.3);ctx.fill();ctx.fillStyle='#fff5cf';for(let i=0;i<6;i++){let a=i*Math.PI/3+e.phase*.3;ctx.beginPath();ctx.arc(Math.cos(a)*e.r*.76,Math.sin(a)*e.r*.76,5+Math.sin(e.phase*2+i)*2,0,7);ctx.fill()}
 if(['inferno','scorpion','hydra','leviathan'].includes(MAPS[save.map][7])){ctx.fillStyle=color;for(let i=0;i<4;i++){let a=i*Math.PI/2+e.phase*.2;polygon(Math.cos(a)*e.r*1.12,Math.sin(a)*e.r*1.12,17,3,a);ctx.fill()}}
}
function draw(){let m=MAPS[save.map];ctx.fillStyle=m[4];ctx.fillRect(0,0,W,H);camX=clamp(p.x-W/2,0,Math.max(0,m[2]-W));camY=clamp(p.y-H/2,0,Math.max(0,m[3]-H));ctx.save();ctx.translate(-camX,-camY);ctx.strokeStyle=m[5];ctx.lineWidth=1;let step=75;for(let x=Math.floor(camX/step)*step;x<camX+W+step;x+=step){ctx.beginPath();ctx.moveTo(x,camY);ctx.lineTo(x,camY+H);ctx.stroke()}for(let y=Math.floor(camY/step)*step;y<camY+H+step;y+=step){ctx.beginPath();ctx.moveTo(camX,y);ctx.lineTo(camX+W,y);ctx.stroke()}
for(let x=Math.floor(camX/260)*260;x<camX+W+260;x+=260)for(let y=Math.floor(camY/260)*260;y<camY+H+260;y+=260){let seed=(x*17+y*31+333)>>>0;mapDecor(x+90+(seed%70),y+70+(seed%45),seed,save.map)}
ctx.strokeStyle=m[6];ctx.lineWidth=10;ctx.strokeRect(5,5,m[2]-10,m[3]-10);ctx.strokeStyle='#ff4e63';ctx.lineWidth=3;ctx.strokeRect(45,45,m[2]-90,m[3]-90);
for(let o of drops){ctx.fillStyle='#8cf4f2';ctx.shadowColor='#8cf4f2';ctx.shadowBlur=3;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill()}ctx.shadowBlur=0;
for(let t of turrets){ctx.fillStyle='#7ee9ff';polygon(t.x,t.y,18,4,time);ctx.fill();ctx.fillStyle='#153246';ctx.beginPath();ctx.arc(t.x,t.y,7,0,7);ctx.fill()}
for(let b of bullets){ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}ctx.shadowBlur=0;
for(let e of enemies){let color=e.boss?m[6]:e.type==='tank'?'#ae84e9':e.type==='runner'?'#ffc078':e.type==='ice'?'#a8edff':e.type==='toxic'?'#9bef8a':e.type==='flame'?'#ff835d':e.type==='shade'||e.type==='wraith'?'#d59bff':e.type==='drone'||e.type==='laserbot'?'#79caff':e.type==='scorpion'||e.type==='burrower'?'#e7ae5e':e.type==='spore'?'#c5e76e':e.type==='golem'?'#b0ba7c':e.type==='magma'?'#ff684f':e.type==='angler'?'#74f2dc':e.type==='blizzard'?'#b3f2ff':'#ef708c';ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.phase*.3);ctx.shadowColor=color;ctx.shadowBlur=e.boss?12:0;ctx.fillStyle=e.hit?'#fff':color;if(e.boss)bossArt(e,color);else{polygon(0,0,e.r,e.r>24?7:5);ctx.fill();ctx.fillStyle='#17202d';ctx.beginPath();ctx.arc(0,0,Math.max(4,e.r*.25),0,7);ctx.fill()}ctx.restore();if(e.r>24){ctx.fillStyle='#201f2b';ctx.fillRect(e.x-e.r,e.y-e.r-16,e.r*2,5);ctx.fillStyle='#ff7b8c';ctx.fillRect(e.x-e.r,e.y-e.r-16,e.r*2*Math.max(0,e.hp/e.max),5)}}
if(skillLevels.orb){ctx.strokeStyle='#bc9bff';ctx.lineWidth=2+skillLevels.orb;ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(p.x,p.y,75+skillLevels.orb*22,0,7);ctx.stroke();ctx.globalAlpha=1}
if(skillLevels.cutter){ctx.fillStyle='#f9e6a2';let n=2+skillLevels.cutter;for(let i=0;i<n;i++){let a=time*2.5+i*6.283/n;polygon(p.x+Math.cos(a)*95,p.y+Math.sin(a)*95,13,3,a);ctx.fill()}}
for(let b of birds){let x=p.x+Math.cos(b.a)*66,y=p.y+Math.sin(b.a)*66;ctx.fillStyle='#d8baff';polygon(x,y,12,3,b.a);ctx.fill()}
if(save.pet!=='none'){let a=time*1.4;ctx.fillStyle=['dragon','phoenix','griffin'].includes(save.pet)?'#ffba85':'#a5ffca';polygon(p.x+Math.cos(a)*52,p.y+Math.sin(a)*52,13,save.pet==='dog'?4:3,a);ctx.fill()}
if(net.active){for(let r of Object.values(net.peers)){if(!r||!r.x||!r.y)continue;ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle||0);ctx.fillStyle=r.hp>0?'#9ef2b5':'#5d6473';polygon(0,0,20,3);ctx.fill();ctx.fillStyle='#152b36';ctx.fillRect(3,-4,23,8);ctx.restore();ctx.fillStyle='#e1ffed';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(r.name||'TEAMMATE',r.x,r.y-34);ctx.fillStyle='#223c45';ctx.fillRect(r.x-22,r.y-29,44,5);ctx.fillStyle='#82e5a2';ctx.fillRect(r.x-22,r.y-29,44*clamp((r.hp||0)/100,0,1),5)}}
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(aim);ctx.shadowColor='#67e8ff';ctx.shadowBlur=5;ctx.fillStyle=inv>0?'white':save.skin==='spider'?'#ed556e':save.skin==='shadow'?'#b19bfa':save.skin==='gold'?'#f6d477':'#6be0f5';polygon(0,0,21,3,0);ctx.fill();ctx.fillStyle='#18273a';ctx.fillRect(4,-5,24,10);ctx.restore();
for(let q of effects){ctx.globalAlpha=clamp(q.life*2,0,1);ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,4,4)}ctx.globalAlpha=1;ctx.restore();ctx.fillStyle='#293b51';ctx.fillRect(W/2-85,H-10,170,5);ctx.fillStyle='#7fe9ff';ctx.fillRect(W/2-85,H-10,170*xp/need,5)}
function loop(now){if(mode!=='play')return;let dt=clamp((now-last)/1000||0,0,.035);last=now;try{update(dt);draw()}catch(err){console.error('Game error:',err);$('error').textContent='Game error: '+err.message;mode='error';menu.style.display='flex';card.innerHTML='<h1>GAME ERROR</h1><p>'+String(err.message).replace(/[<>]/g,'')+'</p><button id="retry">RESTART</button>';$('retry').onclick=begin;return}if(mode==='play')requestAnimationFrame(loop)}
function aimAt(x,y){aim=Math.atan2(y+camY-p.y,x+camX-p.x)}
cv.addEventListener('pointerdown',e=>{if(mode!=='play')return;cv.setPointerCapture(e.pointerId);aimAt(e.clientX,e.clientY);firing=true;audioInit()});cv.addEventListener('pointermove',e=>{if(mode==='play'&&(e.pointerType==='mouse'||cv.hasPointerCapture(e.pointerId)))aimAt(e.clientX,e.clientY)});for(let ev of ['pointerup','pointercancel'])cv.addEventListener(ev,()=>firing=false);

const stick=$('stick'),nub=$('nub');function moveStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,mag=Math.hypot(x,y),max=r.width*.33;if(mag>max){x=x/mag*max;y=y/mag*max}joy.x=x/max;joy.y=y/max;nub.style.transform=`translate(${x}px,${y}px)`}stick.addEventListener('pointerdown',e=>{e.preventDefault();stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))moveStick(e)});function resetStick(){joy.x=joy.y=0;nub.style.transform='translate(0,0)'}for(let ev of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(ev,resetStick);
addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.code==='Space'&&!e.repeat)dash();if(e.key.toLowerCase()==='f')firing=true});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false;if(e.key.toLowerCase()==='f')firing=false});addEventListener('blur',()=>{keys={};joy={x:0,y:0};firing=false});
